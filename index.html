<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цена VOcoin и Kroky</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ece9e6, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            font-size: 1.5em;
            margin: 0.5em 0;
        }

        .price-display {
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        canvas {
            margin-top: 20px;
            width: 80% !important; /* Уменьшение ширины графика до 80% */
            max-height: 300px !important; /* Ограничение высоты графика */
            height: auto !important;
        }

        .button-container {
            position: absolute;
            top: 20px;
            left: 20px;
        }

        .button-container img {
            margin: 20px;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.2em;
            }

            .price-display {
                font-size: 1em;
            }

            .button-container img {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="button-container">
            <a href="https://t.me/VO7CO" target="_blank">
                <img src="65656.jpg" alt="Монета">
            </a>
        </div>
        <h1>Цена монет VOcoin и Kroky</h1>
        <div class="price-display">
            <p>Текущая цена VOcoin XTR: <span id="vOcoinPrice">1.9</span></p>
            <p>Текущая цена Kroky UAH: <span id="krokyPrice">300</span></p>
        </div>
        <canvas id="priceChart"></canvas>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Функция для генерации последних 12 месяцев
        function getLast12Months() {
            const months = [];
            const today = new Date();
            for (let i = 0; i < 12; i++) {
                const date = new Date(today.getFullYear(), today.getMonth() - i, 1);
                months.unshift(date.toLocaleString('default', { month: 'short', year: 'numeric' }));
            }
            return months;
        }

        // Текущие цены (обновляйте здесь)
        let currentVocoPrice = 25;
        let currentKrokyPrice = 1.5;

        // Предыдущие цены
        let previousVocoPrice = 3;
        let previousKrokyPrice = 2;

        // Данные для графика (включая последние 12 месяцев)
        let vOcoinData = [49, 19, 3, 5, 2, 3, 8, 15, 21, 12, 4, previousVocoPrice];
        let krokyData = [22, 29, 5, 5, 12, 13, 18, 25, 31, 9, 5, previousKrokyPrice];

        // Отображение текущих цен
        document.getElementById('vOcoinPrice').textContent = currentVocoPrice;
        document.getElementById('krokyPrice').textContent = currentKrokyPrice;

        // Создание графика
        const ctx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: getLast12Months(),
                datasets: [
                    {
                        label: 'VOcoin',
                        data: vOcoinData,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        fill: true
                    },
                    {
                        label: 'Kroky',
                        data: krokyData,
                        borderColor: 'rgba(153, 102, 255, 1)',
                        backgroundColor: 'rgba(153, 102, 255, 0.2)',
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        // Функция для обновления данных и графика
        function updatePrices(newVocoPrice, newKrokyPrice) {
            // Перемещаем предыдущие цены на один месяц назад
            vOcoinData.shift();
            vOcoinData.push(newVocoPrice);
            krokyData.shift();
            krokyData.push(newKrokyPrice);

            // Обновляем текущие цены
            currentVocoPrice = newVocoPrice;
            currentKrokyPrice = newKrokyPrice;

            // Обновляем отображаемые текущие цены
            document.getElementById('vOcoinPrice').textContent = currentVocoPrice;
            document.getElementById('krokyPrice').textContent = currentKrokyPrice;

            // Обновляем график
            priceChart.data.datasets[0].data = vOcoinData;
            priceChart.data.datasets[1].data = krokyData;
            priceChart.update();
        }

        // Пример вызова функции для обновления цен
        updatePrices(currentVocoPrice, currentKrokyPrice);
    </script>
</body>
</html>
